version: '3.8'

services:
  age-gender-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: age-gender-predictor
    ports:
      - "8006:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8006
      - MODEL_PATH=model_quantized.onnx
      - AGE_CLASSES=18-24,25-34,35-44,45-54,55+
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8006/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

